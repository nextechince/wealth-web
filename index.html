<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth Go | Session</title>
<script>
(function(){
    var s = localStorage.getItem('wealthgo_session');
    if (!s) { window.location.href = 'login.html'; return; }
    try {
        var session = JSON.parse(s);
        if (session.admin) { window.location.href = 'admin.html'; }
        else if (session.userId) { window.location.href = 'dashboard.html'; }
        else { window.location.href = 'login.html'; }
    } catch(e) { window.location.href = 'login.html'; }
})();
</script>
</head>
<body style="background:#06140d;"></body>
</html>
