<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wealth Go - Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at top, #0a1f0a, #000);
    color:#fff;
  }
  .card {
    background:#0d0d0d; border:1px solid #1a1a1a; border-radius:12px;
    padding:40px; width:100%; max-width:420px; box-shadow:0 0 40px rgba(0,255,100,0.1);
  }
  .logo { text-align:center; margin-bottom:30px; }
  .logo h1 { color:#22c55e; font-size:28px; letter-spacing:1px; }
  .logo p { color:#888; font-size:11px; letter-spacing:2px; margin-top:4px; }
  h2 { text-align:center; margin-bottom:24px; font-size:20px; }
  label { display:block; font-size:13px; color:#aaa; margin-bottom:6px; }
  input {
    width:100%; padding:12px; background:#1a1a1a; border:1px solid #2a2a2a;
    border-radius:8px; color:#fff; margin-bottom:16px; outline:none;
  }
  input:focus { border-color:#22c55e; }
  button {
    width:100%; padding:12px; background:#22c55e; color:#000; border:none;
    border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer;
    letter-spacing:1px;
  }
  button:hover { background:#16a34a; }
  .footer { text-align:center; margin-top:20px; font-size:13px; color:#888; }
  .footer a { color:#22c55e; text-decoration:none; }
  .msg { text-align:center; font-size:13px; margin-bottom:12px; min-height:18px; }
  .msg.error { color:#ef4444; }
  .msg.success { color:#22c55e; }
  .admin-hint {
    text-align:center; font-size:11px; color:#555; margin-top:16px;
    border-top:1px solid #1a1a1a; padding-top:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>WEALTH GO</h1>
      <p>INVEST TODAY • GROW TOMORROW</p>
    </div>
    <h2>WELCOME BACK</h2>
    <p class="msg" id="msg"></p>
    <label>Email or Username</label>
    <input type="text" id="email" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button onclick="login()">LOGIN</button>
    <p class="footer">Don't have an account? <a href="signup.html">REGISTER</a></p>
    <p class="admin-hint">Admin? <a href="admin.html" style="color:#22c55e;">Login here</a></p>
  </div>

<script>
// Seed default admin
(function seedAdmin() {
  let admins = JSON.parse(localStorage.getItem('wg_admin') || 'null');
  if (!admins) {
    localStorage.setItem('wg_admin', JSON.stringify({ username: 'admin', password: 'young' }));
  }
})();

function login() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!email || !password) {
    msg.textContent = 'Please enter email and password';
    msg.className = 'msg error';
    return;
  }

  // Admin check
  const admin = JSON.parse(localStorage.getItem('wg_admin'));
  if (email === admin.username && password === admin.password) {
    localStorage.setItem('wg_currentAdmin', 'true');
    msg.textContent = 'Admin login successful!';
    msg.className = 'msg success';
    setTimeout(() => window.location.href = 'admin.html', 800);
    return;
  }

  // User check
  let users = JSON.parse(localStorage.getItem('wg_users') || '[]');
  const user = users.find(u => u.email === email && u.password === password);

  if (!user) {
    msg.textContent = 'Invalid credentials';
    msg.className = 'msg error';
    return;
  }

  localStorage.setItem('wg_currentUser', JSON.stringify(user));
  msg.textContent = 'Login successful!';
  msg.className = 'msg success';
  setTimeout(() => window.location.href = 'dashboard.html', 800);
}
</script>
</body>
</html>
