<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wealth Go | Dashboard</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #06140d;
    color: #eafff2;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.1rem;
    background: rgba(6,20,13,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #123a24;
  }
  .brand { font-weight: 700; font-size: 1.15rem; color: #7fe0a8; letter-spacing: .3px; }
  .brand span { color: #eafff2; }

  .hamburger {
    width: 42px; height: 42px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
    background: #0d2418; border: 1px solid #1e4a30;
    border-radius: 10px; cursor: pointer;
  }
  .hamburger span {
    display: block; width: 20px; height: 2px;
    background: #eafff2; border-radius: 2px;
    transition: transform .25s ease, opacity .2s ease;
  }
  .hamburger.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2){ opacity: 0; }
  .hamburger.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

  /* ---------- Slide menu ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    z-index: 150;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .menu {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(78vw, 300px);
    background: #0b1d13;
    border-left: 1px solid #123a24;
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    z-index: 200;
    padding: 1.4rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  .menu.show { transform: translateX(0); }
  .menu h3 {
    margin: 0 0 1.2rem;
    font-size: .85rem; letter-spacing: 1px;
    text-transform: uppercase; color: #7fb894;
  }
  .menu a, .menu button.link {
    display: block; width: 100%; text-align: left;
    padding: .95rem .9rem;
    color: #eafff2; text-decoration: none;
    background: transparent; border: none;
    border-radius: 10px; font-size: 1rem;
    font-family: inherit; cursor: pointer;
  }
  .menu a:active, .menu button.link:active { background: #123a24; }
  .menu .spacer { flex: 1; }
  .menu .logout {
    padding: .9rem; background: #7a2323; color: #fff;
    border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }

  /* ---------- Main ---------- */
  main {
    max-width: 640px; margin: 0 auto;
    padding: 1.2rem 1.1rem 3rem;
  }
  .hello { font-size: .95rem; color: #9fd8b5; margin-bottom: .2rem; }
  .name  { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.4rem; }

  .balance {
    background: linear-gradient(135deg, #128a4a, #0b5c31);
    border-radius: 18px;
    padding: 1.5rem 1.3rem;
    margin-bottom: 1.2rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .balance .label {
    font-size: .85rem; opacity: .85;
    letter-spacing: .5px; text-transform: uppercase;
  }
  .balance .amount {
    font-size: 2rem; font-weight: 800;
    margin: .4rem 0 .2rem; word-break: break-all;
  }
  .balance .sub { font-size: .8rem; opacity: .8; }

  .actions {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: .8rem; margin-bottom: 1.6rem;
  }
  .btn {
    padding: 1rem .8rem; border-radius: 12px;
    border: none; font-weight: 600; font-size: .95rem;
    cursor: pointer; text-align: center; color: #fff;
  }
  .btn-primary { background: #23a45a; }
  .btn-primary:active { background: #1c8a4a; }
  .btn-ghost { background: transparent; color: #eafff2; border: 1px solid #1e4a30; }
  .btn-ghost:active { background: #0d2418; }

  h2 { font-size: 1.05rem; margin: 1.4rem 0 .8rem; }

  .empty {
    text-align: center; padding: 2rem 1rem;
    background: #0b1d13; border-radius: 14px;
    color: #7fb894; font-size: .92rem;
  }

  .dep {
    background: #0b1d13; border-radius: 12px;
    padding: 1rem; margin-bottom: .7rem;
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem;
  }
  .dep .left { min-width: 0; flex: 1; }
  .dep .amt { font-weight: 700; font-size: 1rem; }
  .dep .meta {
    font-size: .78rem; color: #7fb894; margin-top: .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge {
    font-size: .72rem; font-weight: 700;
    padding: .3rem .6rem; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .4px;
    white-space: nowrap;
  }
  .badge.pending  { background: #4a3b12; color: #ffcc66; }
  .badge.approved { background: #12402a; color: #66e08a; }
  .badge.rejected { background: #4a1212; color: #ff7a7a; }

  /* ---------- Modal ---------- */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 300;
    padding: 0;
  }
  .modal-bg.show { display: flex; }

  .modal {
    width: 100%; max-width: 520px;
    background: #0b1d13;
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
    padding: 1.4rem 1.2rem calc(1.6rem + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
    animation: slideUp .28s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .modal .handle {
    width: 42px; height: 4px;
    background: #1e4a30; border-radius: 3px;
    margin: 0 auto 1rem;
  }
  .modal h3 {
    margin: 0 0 1rem; font-size: 1.15rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal h3 .x {
    background: transparent; border: none;
    color: #7fb894; font-size: 1.5rem;
    cursor: pointer; padding: 0 .3rem; line-height: 1;
  }
  .modal label {
    display: block; margin: .9rem 0 .35rem;
    font-size: .88rem; color: #9fd8b5;
  }
  .modal input, .modal textarea {
    width: 100%; padding: .85rem;
    border-radius: 10px;
    border: 1px solid #1e4a30;
    background: #0a1f13; color: #eafff2;
    font-size: 1rem; font-family: inherit;
  }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal input[type="file"] { padding: .55rem; font-size: .9rem; }
  .modal .submit {
    width: 100%; margin-top: 1.2rem;
    padding: .95rem; border: none; border-radius: 12px;
    background: #23a45a; color: #fff;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .modal .submit:active { background: #1c8a4a; }
  .modal .hint { font-size: .8rem; color: #7fb894; margin-top: .6rem; text-align: center; }
  .modal .preview {
    margin-top: .7rem; max-width: 100%;
    border-radius: 10px; display: none;
  }
  .modal .preview.show { display: block; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #23a45a; color: #fff;
    padding: .8rem 1.2rem; border-radius: 999px;
    font-size: .9rem; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 400;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  .toast.err  { background: #7a2323; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">Wealth<span>Go</span></div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="overlay" id="overlay"></div>

  <nav class="menu" id="menu">
    <h3>Menu</h3>
    <button class="link" onclick="openDeposit()">💰 Deposit</button>
    <button class="link" onclick="openWithdraw()">🏦 Withdraw</button>
    <button class="link" onclick="closeMenu();document.getElementById('history').scrollIntoView({behavior:'smooth'})">📜 History</button>
    <button class="link" onclick="openProfile()">👤 Profile</button>
    <div class="spacer"></div>
    <button class="logout" onclick="logout()">Log out</button>
  </nav>

  <main>
    <div class="hello">Welcome back 👋</div>
    <div class="name" id="userName">User</div>

    <div class="balance">
      <div class="label">Available Balance</div>
      <div class="amount" id="balance">₦0</div>
      <div class="sub" id="balanceSub">Approved deposits only</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="openDeposit()">Deposit</button>
      <button class="btn btn-ghost" onclick="openWithdraw()">Withdraw</button>
    </div>

    <h2 id="history">Recent deposits</h2>
    <div id="depositList"></div>
  </main>

  <!-- ============ DEPOSIT MODAL ============ -->
  <div class="modal-bg" id="depositModal">
    <div class="modal">
      <div class="handle"></div>
      <h3>Make a deposit <button class="x" onclick="closeModal('depositModal')">×</button></h3>

      <label>Amount (₦)</label>
      <input id="dAmount" type="number" inputmode="numeric" placeholder="5000">

      <label>Reference / Note</label>
      <input id="dNote" type="text" placeholder="Palmpay transfer...">

      <label>Upload receipt</label>
      <input id="dReceipt" type="file" accept="image/*" onchange="previewReceipt(event)">
      <img id="dPreview" class="preview" alt="preview">

      <p class="hint">You'll be credited after admin approval.</p>
      <button class="submit" onclick="submitDeposit()">Submit for approval</button>
    </div>
  </div>

  <!-- ============ WITHDRAW MODAL ============ -->
  <div class="modal-bg" id="withdrawModal">
    <div class="modal">
      <div class="handle"></div>
      <h3>Withdraw <button class="x" onclick="closeModal('withdrawModal')">×</button></h3>

      <label>Amount (₦)</label>
      <input id="wAmount" type="number" inputmode="numeric" placeholder="2000">

      <label>Bank / Wallet</label>
      <input id="wBank" type="text" placeholder="Palmpay, OPay, GTBank...">

      <label>Account number</label>
      <input id="wAcct" type="text" inputmode="numeric" placeholder="0123456789">

      <label>Account name</label>
      <input id="wName" type="text" placeholder="John Olumide">

      <p class="hint">Withdrawals are reviewed before payout.</p>
      <button class="submit" onclick="submitWithdraw()">Request withdrawal</button>
    </div>
  </div>

  <!-- ============ PROFILE MODAL ============ -->
  <div class="modal-bg" id="profileModal">
    <div class="modal">
      <div class="handle"></div>
      <h3>Profile <button class="x" onclick="closeModal('profileModal')">×</button></h3>

      <label>Name</label>
      <input id="pName" type="text" disabled>

      <label>User ID</label>
      <input id="pId" type="text" disabled>

      <label>Joined</label>
      <input id="pJoined" type="text" disabled>

      <button class="submit" onclick="closeModal('profileModal')">Close</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ================= GUARD ================= */
if (!localStorage.getItem('wealthgo_session')) {
  window.location.replace('login.html');
}

let session = {};
try { session = JSON.parse(localStorage.getItem('wealthgo_session') || '{}'); }
catch { session = {}; }

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const fmt = n => '₦' + Number(n || 0).toLocaleString();

function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function getDeposits(){
  try { return JSON.parse(localStorage.getItem('wealthgo_deposits') || '[]'); }
  catch { return []; }
}
function saveDeposits(list){
  localStorage.setItem('wealthgo_deposits', JSON.stringify(list));
}
function getWithdrawals(){
  try { return JSON.parse(localStorage.getItem('wealthgo_withdrawals') || '[]'); }
  catch { return []; }
}
function saveWithdrawals(list){
  localStorage.setItem('wealthgo_withdrawals', JSON.stringify(list));
}

/* ================= USER INFO ================= */
$('userName').textContent = session.name || session.username || 'User';

/* ================= RENDER ================= */
function render(){
  const all = getDeposits()
    .filter(d => d.userId === session.userId)
    .sort((a,b) => b.id - a.id);

  const approved = all
    .filter(d => d.status === 'approved')
    .reduce((s,d) => s + Number(d.amount || 0), 0);

  const pendingW = getWithdrawals()
    .filter(w => w.userId === session.userId && w.status === 'pending')
    .reduce((s,w) => s + Number(w.amount || 0), 0);

  $('balance').textContent = fmt(approved);
  $('balanceSub').textContent = pendingW
    ? `₦${pendingW.toLocaleString()} pending withdrawal`
    : 'Approved deposits only';

  const box = $('depositList');
  if (!all.length) {
    box.innerHTML = `<div class="empty">No deposits yet.<br>Tap <b>Deposit</b> to submit your first one.</div>`;
    return;
  }

  box.innerHTML = all.slice(0, 10).map(d => `
    <div class="dep">
      <div class="left">
        <div class="amt">${fmt(d.amount)}</div>
        <div class="meta">${d.note ? d.note : new Date(d.createdAt).toLocaleDateString()}</div>
      </div>
      <span class="badge ${d.status}">${d.status}</span>
    </div>
  `).join('');
}
render();
setInterval(render, 4000);

/* ================= MENU ================= */
const burger  = $('hamburger');
const menu    = $('menu');
const overlay = $('overlay');

function openMenu(){
  burger.classList.add('open');
  menu.classList.add('show');
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeMenu(){
  burger.classList.remove('open');
  menu.classList.remove('show');
  overlay.classList.remove('show');
  document.body.style.overflow = '';
}
function toggleMenu(){
  menu.classList.contains('show') ? closeMenu() : openMenu();
}

burger.addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
overlay.addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMenu(); closeAllModals(); } });

/* ================= MODALS ================= */
function openModal(id){
  closeMenu();
  $(id).classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(id){
  $(id).classList.remove('show');
  if (![...document.querySelectorAll('.modal-bg')].some(m => m.classList.contains('show'))) {
    document.body.style.overflow = '';
  }
}
function closeAllModals(){
  document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('show'));
  document.body.style.overflow = '';
}

// click outside modal to close
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => {
    if (e.target === bg) closeModal(bg.id);
  });
});

function openDeposit(){ openModal('depositModal'); }
function openWithdraw(){ openModal('withdrawModal'); }
function openProfile(){
  $('pName').value   = session.name || session.username || 'User';
  $('pId').value     = session.userId || '—';
  $('pJoined').value = session.loginAt
    ? new Date(session.loginAt).toLocaleString() : '—';
  openModal('profileModal');
}

/* ================= DEPOSIT ================= */
function previewReceipt(e){
  const file = e.target.files[0];
  const img = $('dPreview');
  if (!file) { img.classList.remove('show'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    img.src = ev.target.result;
    img.classList.add('show');
  };
  reader.readAsDataURL(file);
}

function submitDeposit(){
  const amount = Number($('dAmount').value);
  const note   = $('dNote').value.trim();
  const file   = $('dReceipt').files[0];

  if (!amount || amount <= 0) { toast('Enter a valid amount', true); return; }
  if (!file) { toast('Upload your receipt', true); return; }

  const reader = new FileReader();
  reader.onload = ev => {
    const list = getDeposits();
    list.push({
      id: Date.now(),
      userId: session.userId || 'unknown',
      amount,
      note,
      image: ev.target.result,
      status: 'pending',
      createdAt: new Date().toISOString()
    });
    try {
      saveDeposits(list);
      toast('Deposit submitted ✅');
      $('dAmount').value = '';
      $('dNote').value = '';
      $('dReceipt').value = '';
      $('dPreview').classList.remove('show');
      $('dPreview').src = '';
      closeModal('depositModal');
      render();
    } catch(err) {
      toast('Storage full — use a smaller image', true);
    }
  };
  reader.readAsDataURL(file);
}

/* ================= WITHDRAW ================= */
function submitWithdraw(){
  const amount = Number($('wAmount').value);
  const bank   = $('wBank').value.trim();
  const acct   = $('wAcct').value.trim();
  const name   = $('wName').value.trim();

  if (!amount || amount <= 0) { toast('Enter a valid amount', true); return; }
  if (!bank || !acct || !name) { toast('Fill all bank details', true); return; }

  // check against approved balance
  const approved = getDeposits()
    .filter(d => d.userId === session.userId && d.status === 'approved')
    .reduce((s,d) => s + Number(d.amount || 0), 0);

  if (amount > approved) { toast('Insufficient balance', true); return; }

  const list = getWithdrawals();
  list.push({
    id: Date.now(),
    userId: session.userId || 'unknown',
    amount, bank, acct, name,
    status: 'pending',
    createdAt: new Date().toISOString()
  });
  saveWithdrawals(list);
  toast('Withdrawal requested ✅');
  $('wAmount').value = '';
  $('wBank').value = '';
  $('wAcct').value = '';
  $('wName').value = '';
  closeModal('withdrawModal');
  render();
}

/* ================= LOGOUT ================= */
function logout(){
  localStorage.removeItem('wealthgo_session');
  window.location.replace('login.html');
}
</script>
</body>
</html>
