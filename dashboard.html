<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth Go | Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#06140d;color:#fff;min-height:100vh;overflow-x:hidden}
.flex{display:flex}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.gap-1{gap:0.5rem}
.gap-2{gap:1rem}
.gap-3{gap:1.5rem}
.text-center{text-align:center}
.w-full{width:100%}
.hidden{display:none !important}
.text-sm{font-size:0.875rem}
.text-xs{font-size:0.75rem}
.text-muted{color:#7a9e8a}
.text-green{color:#00e676}
.text-danger{color:#ff5252}
.text-warning{color:#ffc107}
.font-bold{font-weight:700}
.font-semibold{font-weight:600}
.mt-1{margin-top:0.5rem}
.mt-2{margin-top:1rem}
.mt-4{margin-top:2rem}
.mb-2{margin-bottom:1rem}
.mb-4{margin-bottom:2rem}
.btn{padding:0.75rem 1.5rem;border-radius:10px;border:none;font-weight:600;cursor:pointer;transition:all 0.2s;font-size:0.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background-color:#00e676;color:#000}
.btn-primary:hover{background-color:#00c853}
.btn-outline{background:transparent;border:1px solid #00e676;color:#00e676}
.btn-outline:hover{background:rgba(0,230,118,0.1)}
.btn-sm{padding:0.4rem 0.8rem;font-size:0.75rem}
.btn-block{width:100%;display:block}
.btn-blue{background:#2979ff;color:#fff}
.btn-blue:hover{background:#1a5bbd}
.app-container{display:flex;min-height:100vh}
.sidebar{width:260px;background:#0a1f14;border-right:1px solid #1a3d27;padding:2rem 1.5rem;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;transition:transform 0.3s}
.logo-area{display:flex;align-items:center;gap:10px;margin-bottom:3rem}
.logo-icon{font-size:1.8rem;color:#00e676}
.logo-text{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px}
.nav-menu{display:flex;flex-direction:column;gap:0.5rem;flex-grow:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:0.8rem 1rem;border-radius:8px;color:#7a9e8a;text-decoration:none;font-weight:500;transition:all 0.2s;cursor:pointer;font-size:0.9rem}
.nav-item:hover,.nav-item.active{background-color:rgba(0,230,118,0.1);color:#00e676}
.nav-item i{width:20px;text-align:center}
.main-content{flex-grow:1;margin-left:260px;padding:2rem 3rem;background:radial-gradient(circle at top right,rgba(0,230,118,0.05),transparent 40%)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem}
.user-profile-sm{display:flex;align-items:center;gap:15px}
.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,#00e676,#00b0ff);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000}
.card{background:#102b1d;border:1px solid #1a3d27;border-radius:16px;padding:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;border-bottom:1px solid #1a3d27;padding-bottom:1rem}
.card-title{font-size:1.1rem;font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-bottom:2rem}
.stat-card{border-radius:16px;padding:1.5rem;display:flex;flex-direction:column;gap:5px}
.stat-card.blue{background:linear-gradient(135deg,#1e3c72,#2a5298)}
.stat-card.green{background:linear-gradient(135deg,#0f9b0f,#00e676);color:#000}
.stat-card.purple{background:linear-gradient(135deg,#4a148c,#7c4dff)}
.stat-card.red{background:linear-gradient(135deg,#b71c1c,#ff5252)}
.stat-label{font-size:0.8rem;opacity:0.9}
.stat-value{font-size:1.8rem;font-weight:700}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{color:#7a9e8a;font-size:0.8rem;font-weight:500;padding-bottom:1rem;border-bottom:1px solid #1a3d27;text-transform:uppercase}
td{padding:1rem 0;font-size:0.9rem;border-bottom:1px solid rgba(31,74,49,0.5)}
tr:last-child td{border-bottom:none}
.status-badge{padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:600}
.status-completed{background:rgba(0,230,118,0.15);color:#00e676}
.status-pending{background:rgba(255,193,7,0.15);color:#ffc107}
.vip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem}
.vip-card{background:#102b1d;border:1px solid #1a3d27;border-radius:12px;padding:1.5rem;text-align:center;transition:transform 0.2s,border-color 0.2s}
.vip-card:hover{transform:translateY(-5px);border-color:#00e676}
.vip-title{color:#00e676;font-weight:700;margin-bottom:0.5rem}
.vip-amount{font-size:1.5rem;font-weight:800;margin-bottom:0.5rem}
.vip-daily{font-size:0.85rem;color:#7a9e8a;margin-bottom:1rem}
.vip-daily span{color:#00e676;font-weight:600}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;margin-bottom:0.5rem;font-size:0.85rem;color:#7a9e8a}
.form-control{width:100%;padding:0.85rem 1rem;background:#081c11;border:1px solid #1a3d27;border-radius:10px;color:#fff;outline:none;transition:border 0.2s;font-size:0.9rem}
.form-control:focus{border-color:#00e676}
.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
.payment-options{display:flex;gap:0.8rem;flex-wrap:wrap}
.payment-options .btn{flex:1;min-width:120px}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main-content{margin-left:0;padding:1.5rem 1rem}
.stats-grid{grid-template-columns:1fr}
.grid-2{grid-template-columns:1fr}
.menu-toggle{display:block}
.top-bar{flex-wrap:wrap;gap:1rem}
}
</style>
</head>
<body>
<div class="app-container">
<aside class="sidebar" id="sidebar">
<div class="logo-area">
<i class="fas fa-chart-line logo-icon"></i>
<div class="logo-text">WEALTH GO</div>
</div>
<nav class="nav-menu">
<a class="nav-item active" data-section="dashboard" onclick="showSection('dashboard')"><i class="fas fa-home"></i> Dashboard</a>
<a class="nav-item" data-section="deposit" onclick="showSection('deposit')"><i class="fas fa-wallet"></i> Deposit</a>
<a class="nav-item" data-section="withdraw" onclick="showSection('withdraw')"><i class="fas fa-money-bill-wave"></i> Withdraw</a>
<a class="nav-item" data-section="investments" onclick="showSection('investments')"><i class="fas fa-chart-pie"></i> VIP Plans</a>
<a class="nav-item" data-section="history" onclick="showSection('history')"><i class="fas fa-history"></i> History</a>
<a class="nav-item" data-section="profile" onclick="showSection('profile')"><i class="fas fa-user-circle"></i> Profile</a>
<a class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
</nav>
</aside>

<main class="main-content">
<div class="top-bar">
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
<div class="user-profile-sm">
<div class="avatar" id="userAvatar">U</div>
<div>
<div class="font-semibold" id="userNameDisplay">User</div>
<div class="text-muted text-xs" id="userEmailDisplay">user@email.com</div>
</div>
</div>
<div class="status-badge status-completed" id="portalBadge">Withdrawal Portal: OPEN</div>
</div>
<div id="userContent"></div>
</main>
</div>

<script>
var USERS_KEY='wealthgo_users';
var SESSION_KEY='wealthgo_session';
var SETTINGS_KEY='wealthgo_settings';
var TRANSACTIONS_KEY='wealthgo_transactions';
var INVESTMENTS_KEY='wealthgo_investments';
var VIP_PLANS=[
{id:1,name:'VIP 1',amount:3000,daily:750},
{id:2,name:'VIP 2',amount:5000,daily:1250},
{id:3,name:'VIP 3',amount:10000,daily:2500},
{id:4,name:'VIP 4',amount:20000,daily:5000},
{id:5,name:'VIP 5',amount:50000,daily:12500},
{id:6,name:'VIP 6',amount:100000,daily:25000},
{id:7,name:'VIP 7',amount:200000,daily:50000}
];

function initStorage(){
if(!localStorage.getItem(USERS_KEY)){
localStorage.setItem(USERS_KEY,JSON.stringify([{
id:1,email:'demo@wealthgo.com',username:'demouser',password:'password123',
balance:2350,earnings:7500,activeInvest:3000,
bankAccNo:'8111556330',bankAccName:'John Olumide',bankName:'Palmpay',
createdAt:new Date().toISOString()
}]));
}
if(!localStorage.getItem(SETTINGS_KEY)){
localStorage.setItem(SETTINGS_KEY,JSON.stringify({withdrawalPortalOpen:true,minWithdrawal:1000,siteName:'Wealth Go'}));
}
if(!localStorage.getItem(TRANSACTIONS_KEY)){
localStorage.setItem(TRANSACTIONS_KEY,JSON.stringify([
{id:1,userId:1,type:'Deposit',amount:3000,date:'2025-06-15',status:'Completed',method:'Bank Transfer'},
{id:2,userId:1,type:'Income',amount:750,date:'2025-06-15',status:'Completed',method:'Daily ROI'}
]));
}
if(!localStorage.getItem(INVESTMENTS_KEY)){
localStorage.setItem(INVESTMENTS_KEY,JSON.stringify([
{id:1,userId:1,plan:'VIP 1',amount:3000,dailyIncome:750,status:'Active',date:'2025-06-15'}
]));
}
}
initStorage();

function getUsers(){return JSON.parse(localStorage.getItem(USERS_KEY))||[]}
function saveUsers(u){localStorage.setItem(USERS_KEY,JSON.stringify(u))}
function getSession(){return JSON.parse(localStorage.getItem(SESSION_KEY))}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
function getSettings(){return JSON.parse(localStorage.getItem(SETTINGS_KEY))||{withdrawalPortalOpen:true,minWithdrawal:1000}}
function saveSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
function getTransactions(){return JSON.parse(localStorage.getItem(TRANSACTIONS_KEY))||[]}
function saveTransactions(t){localStorage.setItem(TRANSACTIONS_KEY,JSON.stringify(t))}
function getInvestments(){return JSON.parse(localStorage.getItem(INVESTMENTS_KEY))||[]}
function saveInvestments(i){localStorage.setItem(INVESTMENTS_KEY,JSON.stringify(i))}
function formatNaira(n){return '₦'+Number(n).toLocaleString('en-NG')}
function getCurrentUser(){
var s=getSession();
if(!s||!s.userId)return null;
return getUsers().find(function(u){return u.id===s.userId})||null;
}

function handleLogout(){
clearSession();
window.location.href='login.html';
}

function checkSession(){
var s=getSession();
if(!s){window.location.href='login.html';return false}
if(s.admin){window.location.href='admin.html';return false}
if(!s.userId){window.location.href='login.html';return false}
return true;
}

function renderTopBar(){
var user=getCurrentUser();
if(!user)return;
document.getElementById('userAvatar').textContent=user.username.charAt(0).toUpperCase();
document.getElementById('userNameDisplay').textContent=user.username;
document.getElementById('userEmailDisplay').textContent=user.email;
var settings=getSettings();
var badge=document.getElementById('portalBadge');
if(settings.withdrawalPortalOpen){
badge.textContent='Withdrawal Portal: OPEN';
badge.className='status-badge status-completed';
}else{
badge.textContent='Withdrawal Portal: CLOSED';
badge.className='status-badge status-pending';
}
}

function setActiveNav(section){
var items=document.querySelectorAll('.nav-item');
items.forEach(function(item){
item.classList.remove('active');
if(item.getAttribute('data-section')===section)item.classList.add('active');
});
}

function showSection(section){
if(!checkSession())return;
renderTopBar();
setActiveNav(section);
var user=getCurrentUser();
if(!user)return;
var container=document.getElementById('userContent');
var settings=getSettings();
var investments=getInvestments().filter(function(i){return i.userId===user.id});
var transactions=getTransactions().filter(function(t){return t.userId===user.id});
var activeInvestments=investments.filter(function(i){return i.status==='Active'});
var totalActive=activeInvestments.reduce(function(s,i){return s+i.amount},0);

if(section==='dashboard'){
container.innerHTML=
'<div class="stats-grid">'+
'<div class="stat-card blue"><div class="stat-label">ACCOUNT BALANCE</div><div class="stat-value">'+formatNaira(user.balance)+'</div></div>'+
'<div class="stat-card green"><div class="stat-label">TOTAL EARNINGS</div><div class="stat-value">'+formatNaira(user.earnings)+'</div></div>'+
'<div class="stat-card purple"><div class="stat-label">ACTIVE INVESTMENTS</div><div class="stat-value">'+formatNaira(totalActive)+'</div></div>'+
'</div>'+
'<div class="card mb-4">'+
'<div class="card-header"><div class="card-title">My Investments</div></div>'+
'<div class="table-container"><table><thead><tr><th>PLAN</th><th>AMOUNT</th><th>DAILY INCOME</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>'+
(investments.length===0?'<tr><td colspan="5" class="text-center text-muted">No investments yet</td></tr>':
investments.map(function(inv){
return '<tr><td>'+inv.plan+'</td><td>'+formatNaira(inv.amount)+'</td><td class="text-green">'+formatNaira(inv.dailyIncome)+'</td><td><span class="status-badge '+(inv.status==='Active'?'status-completed':'status-pending')+'">'+inv.status+'</span></td><td><button class="btn btn-outline btn-sm">View</button></td></tr>';
}).join(''))+
'</tbody></table></div></div>'+
'<div class="card">'+
'<div class="card-header"><div class="card-title">Recent Transactions</div></div>'+
'<div class="table-container"><table><thead><tr><th>TYPE</th><th>AMOUNT</th><th>DATE</th><th>STATUS</th></tr></thead><tbody>'+
(transactions.length===0?'<tr><td colspan="4" class="text-center text-muted">No transactions yet</td></tr>':
transactions.slice(-5).reverse().map(function(tx){
return '<tr><td>'+tx.type+'</td><td class="'+(tx.type==='Income'?'text-green':'')+'">'+formatNaira(tx.amount)+'</td><td>'+tx.date+'</td><td><span class="status-badge '+(tx.status==='Completed'?'status-completed':'status-pending')+'">'+tx.status+'</span></td></tr>';
}).join(''))+
'</tbody></table></div></div>';
}

if(section==='investments'){
container.innerHTML=
'<h2 class="mb-4">Investment Plans</h2>'+
'<p class="text-muted mb-4">Choose your VIP plan and start earning daily.</p>'+
'<div class="vip-grid">'+
VIP_PLANS.map(function(p){
return '<div class="vip-card">'+
'<div class="vip-title">💎 '+p.name+'</div>'+
'<div class="vip-amount">'+formatNaira(p.amount)+'</div>'+
'<div class="vip-daily">Daily Income: <span>'+formatNaira(p.daily)+'</span></div>'+
'<button class="btn btn-primary btn-block" onclick="invest('+p.id+')">INVEST NOW</button>'+
'</div>';
}).join('')+
'</div>';
}

if(section==='deposit'){
container.innerHTML=
'<h2 class="mb-4">Make a Deposit</h2>'+
'<p class="text-muted mb-4">Fund your account to activate your investment plan.</p>'+
'<div class="grid-2">'+
'<div class="card">'+
'<div class="card-header"><div class="card-title">Select Payment Method</div></div>'+
'<div class="payment-options mb-2">'+
'<button class="btn btn-outline" onclick="selectPayment(\'USDT (TRC20)\')"><i class="fas fa-coins"></i> USDT TRC20</button>'+
'<button class="btn btn-outline" onclick="selectPayment(\'USDT (BEP20)\')"><i class="fas fa-coins"></i> USDT BEP20</button>'+
'<button class="btn btn-outline" onclick="selectPayment(\'Bank Transfer\')"><i class="fas fa-university"></i> Bank Transfer</button>'+
'</div>'+
'<div class="form-group"><label>Amount (₦)</label><input type="number" id="depositAmount" class="form-control" placeholder="Enter amount"></div>'+
'<button class="btn btn-primary btn-block" onclick="generatePayment()">GENERATE PAYMENT DETAILS</button>'+
'</div>'+
'<div class="card hidden" id="paymentCard">'+
'<div class="card-header"><div class="card-title">Payment Details</div></div>'+
'<div id="paymentContent"></div>'+
'<div class="form-group mt-2"><label>Upload Screenshot Proof</label><input type="file" class="form-control" id="depositProof" accept="image/*"></div>'+
'<div class="form-group"><label>Account Name (Sender)</label><input type="text" class="form-control" id="depositSender" placeholder="Enter account name"></div>'+
'<button class="btn btn-primary btn-block mt-2" onclick="submitDeposit()">SUBMIT PROOF FOR APPROVAL</button>'+
'</div>'+
'</div>';
}

if(section==='withdraw'){
container.innerHTML=
'<h2 class="mb-4">Request Withdrawal</h2>'+
'<p class="text-muted mb-4">Withdraw your earnings to your wallet.</p>'+
(!settings.withdrawalPortalOpen?'<div class="card mb-4" style="border-color:#ff5252;"><p class="text-danger"><i class="fas fa-exclamation-triangle"></i> Withdrawal portal is currently closed. Please check back later.</p></div>':'')+
'<div class="grid-2">'+
'<div class="card">'+
'<div class="card-header"><div class="card-title">Withdrawal Form</div></div>'+
'<div class="form-group"><label>Amount (₦)</label><input type="number" id="withdrawAmount" class="form-control" placeholder="Enter amount"></div>'+
'<div class="form-group"><label>Wallet Address</label><input type="text" id="withdrawWallet" class="form-control" placeholder="Enter your USDT wallet address"></div>'+
'<div class="form-group"><label>Network</label><select id="withdrawNetwork" class="form-control"><option>USDT (BEP20)</option><option>USDT (TRC20)</option></select></div>'+
'<button class="btn btn-primary btn-block" onclick="requestWithdrawal()" '+(!settings.withdrawalPortalOpen?'disabled style="opacity:0.5;"':'')+'>REQUEST WITHDRAWAL</button>'+
'</div>'+
'<div class="card">'+
'<div class="card-header"><div class="card-title">Recent Withdrawals</div></div>'+
'<div class="table-container"><table><thead><tr><th>AMOUNT</th><th>METHOD</th><th>DATE</th><th>STATUS</th></tr></thead><tbody>'+
(transactions.filter(function(t){return t.type==='Withdrawal'}).length===0?'<tr><td colspan="4" class="text-center text-muted">No withdrawals yet</td></tr>':
transactions.filter(function(t){return t.type==='Withdrawal'}).reverse().map(function(tx){
return '<tr><td>'+formatNaira(tx.amount)+'</td><td>'+(tx.method||'USDT')+'</td><td>'+tx.date+'</td><td><span class="status-badge '+(tx.status==='Completed'?'status-completed':'status-pending')+'">'+tx.status+'</span></td></tr>';
}).join(''))+
'</tbody></table></div></div>'+
'</div>';
}

if(section==='history'){
container.innerHTML=
'<h2 class="mb-4">Transaction History</h2>'+
'<div class="card"><div class="table-container"><table><thead><tr><th>TYPE</th><th>AMOUNT</th><th>METHOD</th><th>DATE</th><th>STATUS</th></tr></thead><tbody>'+
(transactions.length===0?'<tr><td colspan="5" class="text-center text-muted">No transactions yet</td></tr>':
transactions.slice().reverse().map(function(tx){
return '<tr><td>'+tx.type+'</td><td class="'+(tx.type==='Income'?'text-green':'')+'">'+formatNaira(tx.amount)+'</td><td>'+(tx.method||'—')+'</td><td>'+tx.date+'</td><td><span class="status-badge '+(tx.status==='Completed'?'status-completed':'status-pending')+'">'+tx.status+'</span></td></tr>';
}).join(''))+
'</tbody></table></div></div>';
}

if(section==='profile'){
container.innerHTML=
'<h2 class="mb-4">Profile & Bank Details</h2>'+
'<div class="grid-2">'+
'<div class="card">'+
'<div class="card-header"><div class="card-title">Account Information</div></div>'+
'<div class="form-group"><label>Username</label><input type="text" class="form-control" value="'+user.username+'" disabled></div>'+
'<div class="form-group"><label>Email</label><input type="text" class="form-control" value="'+user.email+'" disabled></div>'+
'<div class="form-group"><label>Account Balance</label><input type="text" class="form-control" value="'+formatNaira(user.balance)+'" disabled></div>'+
'<div class="form-group"><label>Total Earnings</label><input type="text" class="form-control" value="'+formatNaira(user.earnings)+'" disabled></div>'+
'</div>'+
'<div class="card">'+
'<div class="card-header"><div class="card-title">Bank Account Setup</div></div>'+
'<p class="text-muted text-xs mb-2">These details will be used for withdrawals.</p>'+
'<div class="form-group"><label>Account Number</label><input type="text" id="bankAccNo" class="form-control" value="'+(user.bankAccNo||'')+'" placeholder="Enter account number"></div>'+
'<div class="form-group"><label>Account Name</label><input type="text" id="bankAccName" class="form-control" value="'+(user.bankAccName||'')+'" placeholder="Enter account name"></div>'+
'<div class="form-group"><label>Bank Name</label><input type="text" id="bankName" class="form-control" value="'+(user.bankName||'')+'" placeholder="Enter bank name"></div>'+
'<button class="btn btn-primary" onclick="saveBankDetails()">SAVE BANK DETAILS</button>'+
'</div>'+
'</div>';
}
}

function invest(planId){
if(!checkSession())return;
var user=getCurrentUser();
if(!user)return;
var plan=VIP_PLANS.find(function(p){return p.id===planId});
if(!plan)return;
if(user.balance<plan.amount){
alert('Insufficient balance. Please deposit '+formatNaira(plan.amount)+' to activate '+plan.name+'.');
return;
}
if(!confirm('Invest '+formatNaira(plan.amount)+' in '+plan.name+'? Daily income: '+formatNaira(plan.daily)))return;
user.balance-=plan.amount;
user.activeInvest+=plan.amount;
saveUsers(getUsers().map(function(u){return u.id===user.id?user:u}));
var invs=getInvestments();
invs.push({
id:invs.length>0?Math.max.apply(null,invs.map(function(i){return i.id}))+1:1,
userId:user.id,
plan:plan.name,
amount:plan.amount,
dailyIncome:plan.daily,
status:'Active',
date:new Date().toISOString().split('T')[0]
});
saveInvestments(invs);
var txs=getTransactions();
txs.push({
id:txs.length>0?Math.max.apply(null,txs.map(function(t){return t.id}))+1:1,
userId:user.id,
type:'Investment',
amount:plan.amount,
date:new Date().toISOString().split('T')[0],
status:'Completed',
method:plan.name
});
saveTransactions(txs);
alert('Investment successful! '+plan.name+' activated.');
showSection('dashboard');
}

var selectedPaymentMethod='';

function selectPayment(method){
selectedPaymentMethod=method;
var btns=document.querySelectorAll('.payment-options .btn');
btns.forEach(function(b){b.classList.remove('btn-primary');b.classList.add('btn-outline')});
event.target.classList.remove('btn-outline');
event.target.classList.add('btn-primary');
}

function generatePayment(){
if(!selectedPaymentMethod){alert('Please select a payment method first');return}
var amount=document.getElementById('depositAmount').value;
if(!amount||amount<=0){alert('Please enter a valid amount');return}
var card=document.getElementById('paymentCard');
card.classList.remove('hidden');
var content=document.getElementById('paymentContent');
var html='';
if(selectedPaymentMethod==='Bank Transfer'){
html='<p class="text-muted text-sm mb-2">Transfer to the account below:</p>'+
'<div class="form-group"><label>Bank Name</label><input type="text" class="form-control" value="Palmpay" readonly></div>'+
'<div class="form-group"><label>Account Number</label><input type="text" class="form-control" value="8111556330" readonly></div>'+
'<div class="form-group"><label>Account Name</label><input type="text" class="form-control" value="John Olumide" readonly></div>'+
'<div class="form-group"><label>Amount</label><input type="text" class="form-control" value="'+formatNaira(amount)+'" readonly></div>';
}else{
html='<p class="text-muted text-sm mb-2">Send '+selectedPaymentMethod+' to the wallet below:</p>'+
'<div class="form-group"><label>Wallet Address</label><input type="text" class="form-control" value="TJ8xK9mN2pQrS5vW7yZ3aB4cD6eF1gH" readonly></div>'+
'<div class="form-group"><label>Network</label><input type="text" class="form-control" value="'+selectedPaymentMethod+'" readonly></div>'+

function submitDeposit(){
if(!checkSession())return;
var user=getCurrentUser();
if(!user)return;
var amount=document.getElementById('depositAmount').value;
var sender=document.getElementById('depositSender').value.trim();
var proof=document.getElementById('depositProof').value;
if(!amount||amount<=0){alert('Invalid amount');return}
if(!sender){alert('Please enter sender account name');return}
if(!proof){alert('Please upload a screenshot proof');return}
var txs=getTransactions();
txs.push({
id:txs.length>0?Math.max.apply(null,txs.map(function(t){return t.id}))+1:1,
userId:user.id,
type:'Deposit',
amount:Number(amount),
date:new Date().toISOString().split('T')[0],
status:'Pending',
method:selectedPaymentMethod||'Bank Transfer',
sender:sender
});
saveTransactions(txs);
alert('Deposit submitted for approval. You will be credited once approved by admin.');
selectedPaymentMethod='';
showSection('dashboard');
}

function requestWithdrawal(){
if(!checkSession())return;
var user=getCurrentUser();
if(!user)return;
var settings=getSettings();
if(!settings.withdrawalPortalOpen){alert('Withdrawal portal is currently closed');return}
var amount=Number(document.getElementById('withdrawAmount').value);
var wallet=document.getElementById('withdrawWallet').value.trim();
var network=document.getElementById('withdrawNetwork').value;
if(!amount||amount<=0){alert('Enter a valid amount');return}
if(amount<settings.minWithdrawal){alert('Minimum withdrawal is '+formatNaira(settings.minWithdrawal));return}
if(amount>user.balance){alert('Insufficient balance. Your balance is '+formatNaira(user.balance));return}
if(!wallet){alert('Please enter your wallet address');return}
user.balance-=amount;
saveUsers(getUsers().map(function(u){return u.id===user.id?user:u}));
var txs=getTransactions();
txs.push({
id:txs.length>0?Math.max.apply(null,txs.map(function(t){return t.id}))+1:1,
userId:user.id,
type:'Withdrawal',
amount:amount,
date:new Date().toISOString().split('T')[0],
status:'Pending',
method:network,
wallet:wallet
});
saveTransactions(txs);
alert('Withdrawal request submitted. Awaiting admin approval.');
showSection('dashboard');
}

function saveBankDetails(){
if(!checkSession())return;
var user=getCurrentUser();
if(!user)return;
var accNo=document.getElementById('bankAccNo').value.trim();
var accName=document.getElementById('bankAccName').value.trim();
var bankName=document.getElementById('bankName').value.trim();
if(!accNo||!accName||!bankName){alert('Please fill in all bank details');return}
user.bankAccNo=accNo;
user.bankAccName=accName;
user.bankName=bankName;
saveUsers(getUsers().map(function(u){return u.id===user.id?user:u}));
alert('Bank details saved successfully');
}

if(!checkSession()){
document.body.innerHTML='';
}else{
showSection('dashboard');
}
</script>
