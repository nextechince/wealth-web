<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wealth Go - Sign Up</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at top, #0a1f0a, #000);
    color:#fff;
  }
  .card {
    background:#0d0d0d; border:1px solid #1a1a1a; border-radius:12px;
    padding:40px; width:100%; max-width:420px; box-shadow:0 0 40px rgba(0,255,100,0.1);
  }
  .logo { text-align:center; margin-bottom:30px; }
  .logo h1 { color:#22c55e; font-size:28px; letter-spacing:1px; }
  .logo p { color:#888; font-size:11px; letter-spacing:2px; margin-top:4px; }
  h2 { text-align:center; margin-bottom:24px; font-size:20px; }
  label { display:block; font-size:13px; color:#aaa; margin-bottom:6px; }
  input {
    width:100%; padding:12px; background:#1a1a1a; border:1px solid #2a2a2a;
    border-radius:8px; color:#fff; margin-bottom:16px; outline:none;
  }
  input:focus { border-color:#22c55e; }
  button {
    width:100%; padding:12px; background:#22c55e; color:#000; border:none;
    border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer;
    letter-spacing:1px;
  }
  button:hover { background:#16a34a; }
  .footer { text-align:center; margin-top:20px; font-size:13px; color:#888; }
  .footer a { color:#22c55e; text-decoration:none; }
  .msg { text-align:center; font-size:13px; margin-bottom:12px; min-height:18px; }
  .msg.error { color:#ef4444; }
  .msg.success { color:#22c55e; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>WEALTH GO</h1>
      <p>INVEST TODAY • GROW TOMORROW</p>
    </div>
    <h2>CREATE ACCOUNT</h2>
    <p class="msg" id="msg"></p>
    <label>Full Name</label>
    <input type="text" id="name" placeholder="">
    <label>Email</label>
    <input type="email" id="email" placeholder="">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button onclick="signup()">SIGN UP</button>
    <p class="footer">Already have an account? <a href="login.html">LOGIN</a></p>
  </div>

<script>
function signup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!name || !email || !password) {
    msg.textContent = 'Please fill all fields';
    msg.className = 'msg error';
    return;
  }

  let users = JSON.parse(localStorage.getItem('wg_users') || '[]');

  if (users.find(u => u.email === email)) {
    msg.textContent = 'Email already registered';
    msg.className = 'msg error';
    return;
  }

  const newUser = {
    id: Date.now(),
    name, email, password,
    balance: 0,
    totalEarnings: 0,
    activeInvestment: 0,
    vipLevel: 'None',
    status: 'Active',
    joined: new Date().toISOString()
  };

  users.push(newUser);
  localStorage.setItem('wg_users', JSON.stringify(users));

  // Notify admin
  let notifs = JSON.parse(localStorage.getItem('wg_notifications') || '[]');
  notifs.unshift({
    id: Date.now(),
    type: 'signup',
    message: `New user registered: ${name} (${email})`,
    time: new Date().toISOString(),
    read: false
  });
  localStorage.setItem('wg_notifications', JSON.stringify(notifs));

  msg.textContent = 'Account created! Redirecting...';
  msg.className = 'msg success';
  setTimeout(() => window.location.href = 'login.html', 1200);
}
</script>
</body>
</html>
